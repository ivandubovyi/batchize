<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#FDFBF7;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden;position:relative}
.wrap{padding:70px 76px;height:100%;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:2}
.brand{font-size:34px;font-weight:800;color:#14161A;letter-spacing:-.02em}
.brand i{color:#F0741F;font-style:normal}
h1{font-size:74px;line-height:1.06;font-weight:800;color:#14161A;letter-spacing:-.035em;max-width:940px}
h1 em{font-style:normal;color:#F0741F}
p{font-size:27px;color:#5B6270;font-weight:500;max-width:800px;margin-top:26px;line-height:1.4}
.row{display:flex;gap:12px;align-items:center}
.pill{background:#fff;border:1px solid #E7E3DA;border-radius:999px;padding:11px 22px;font-size:20px;font-weight:600;color:#14161A}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.4}
.b1{width:520px;height:520px;background:#F0741F;right:-160px;top:-190px}
.b2{width:420px;height:420px;background:#FFC48A;right:60px;bottom:-220px}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap">
  <div class="brand">Batchize<i>.</i></div>
  <div>
    <h1>The mistakes that sink YC applications are <em>invisible one answer at a time</em></h1>
    <p>Every answer checked against what that question is really asking, and against your other answers.</p>
  </div>
  <div class="row">
    <span class="pill">Free</span>
    <span class="pill">No account needed</span>
    <span class="pill">Nothing uploaded unless you ask</span>
  </div>
</div>
</body></html>
